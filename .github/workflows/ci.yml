name: CI

# Run on every push and every pull-request, across all branches.
on:
  push:
  pull_request:

jobs:

  # ---------------------------------------------------------------------------
  # Universal tests — no GPU required.
  # Covers enum values, pixel format utilities, and descriptor construction.
  # Runs on macOS, Linux, and Windows using the platform's native toolchain.
  # ---------------------------------------------------------------------------
  universal-tests:
    name: Universal tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: macOS Intel (x86_64)
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
          - os: ubuntu-24.04-arm
            name: Linux arm64 — PulseAudio
          - os: windows-latest
            name: Windows
          - os: windows-11-arm
            name: Windows arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev

      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --target campello_gpu_universal_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure -R campello_gpu_universal_tests

  # ---------------------------------------------------------------------------
  # Linux Vulkan build + tests.
  # Builds the full campello_gpu shared library and runs the full test suite
  # (universal + integration) against Mesa lavapipe (software Vulkan), with
  # the Khronos validation layer enabled so synchronization/threading bugs
  # (e.g. concurrent VkCommandPool use) surface as validation errors instead
  # of relying on lavapipe happening to crash or produce visibly wrong
  # output. Integration test failures gate this job.
  # ---------------------------------------------------------------------------
  build-linux-vulkan:
    name: Build check (Linux / Vulkan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers

      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -DBUILD_INTEGRATION_TESTS=ON -DCAMPELLO_GPU_VALIDATION=ON

      - name: Build library
        run: cmake --build build --target campello_gpu

      - name: Build integration tests
        run: cmake --build build --target campello_gpu_integration_tests

      - name: Build & run universal tests
        run: |
          cmake --build build --target campello_gpu_universal_tests
          ctest --test-dir build --output-on-failure -R campello_gpu_universal_tests

      - name: Run integration tests (lavapipe)
        run: |
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          ctest --test-dir build --output-on-failure -R campello_gpu_integration_tests

  # ---------------------------------------------------------------------------
  # Metal integration tests — macOS only.
  # GitHub-hosted macOS runners are real Apple hardware with a GPU, so Metal
  # is available and integration tests can run end-to-end.
  # ---------------------------------------------------------------------------
  metal-integration:
    name: Metal integration tests (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -DBUILD_INTEGRATION_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # iOS build check — compile the Metal backend for the iOS simulator.
  # No tests are executed: there is no test runner without a connected device
  # or a fully configured simulator environment.
  # Code signing is disabled so the check works on any runner without a cert.
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build check (iOS / Metal)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Configure (iOS simulator)
        run: |
          cmake -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build
        run: cmake --build build --config Release

  # ---------------------------------------------------------------------------
  # Android build check — cross-compile the Vulkan backend with the NDK for
  # all four supported ABIs: 64-bit (arm64-v8a, x86_64) and 32-bit
  # (armeabi-v7a, x86). No tests are executed: running on-device tests
  # requires a connected device or a Vulkan-capable emulator.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build check (Android / ${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]

    steps:
      - uses: actions/checkout@v6

      - name: Configure (${{ matrix.abi }}, API 28)
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

  # ---------------------------------------------------------------------------
  # Windows build check — compile the DirectX 12 backend.
  # No tests are executed: GPU integration tests require a DX12-capable device
  # which is not available on standard GitHub-hosted Windows runners.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build check (Windows / DirectX 12)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

  # ---------------------------------------------------------------------------
  # Xbox console (GXDK) partition simulation — compile the DirectX 12 backend
  # under WINAPI_FAMILY_GAMES (see TODO.md's "Windows / Xbox (Microsoft GDK)
  # partition support" section for the full 2026-08-24 correction this
  # comment reflects). WINAPI_FAMILY_GAMES is NOT what Gaming.Desktop.x64
  # uses -- confirmed against the real, free, public Microsoft GDK: its own
  # Platform.Common.props sets WINAPI_FAMILY_DESKTOP_APP, and campello_gpu
  # already builds, links, and passes its full integration-test suite as an
  # ordinary HWND-based Win32 app under the real Gaming.Desktop.x64 MSBuild
  # platform with zero source changes -- no CAMPELLO_GDK_GAMING_DESKTOP
  # needed for that target at all. WINAPI_FAMILY_GAMES is the actual Xbox
  # **console** partition (part of the non-public GXDK, which this project
  # has never had access to), so this job is a best-effort stand-in for that
  # unreachable check using only the stock Windows SDK's copy of the same
  # partition macro (shipped since SDK 19041) -- see
  # CAMPELLO_GDK_GAMING_DESKTOP's doc comment in the root CMakeLists.txt.
  # Library only, same as build-windows above -- no tests (this doesn't
  # attempt to run the GAMES-restricted binary, only compile it).
  # ---------------------------------------------------------------------------
  build-windows-gdk:
    name: Build check (Windows / DirectX 12 / GDK partition)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCAMPELLO_GDK_GAMING_DESKTOP=ON

      - name: Build
        run: cmake --build build --target campello_gpu --config Release

  # ---------------------------------------------------------------------------
  # UWP build check (Windows PC and Xbox Developer Mode). Library only: there's no
  # console in CI, so this catches desktop-only APIs reaching the UWP build, such
  # as HWND calls outside the CAMPELLO_DX_UWP guards.
  # ---------------------------------------------------------------------------
  build-windows-uwp:
    name: Build check (Windows / DirectX 12 / UWP)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        shell: cmd
        run: cmake -B build -A x64 -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0

      - name: Build
        run: cmake --build build --target campello_gpu --config Release

  # ---------------------------------------------------------------------------
  # WASM / WebGPU — build with Emscripten, then run the browser test.
  # tests/webgpu/webgpu_browser_test runs in headless Chrome (GoogleTest can't
  # run in a browser page). The runner has no GPU, so Chrome uses its bundled
  # SwiftShader (CPU Vulkan) as the WebGPU adapter.
  # ---------------------------------------------------------------------------
  build-wasm:
    name: WASM / WebGPU (build + browser test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # >= 4.0.10: first release whose emdawnwebgpu port this backend targets
          version: 4.0.10
          actions-cache-folder: 'emsdk-cache'

      # run_in_browser.mjs needs Node >= 22 (global WebSocket).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure (emcmake)
        run: >
          emcmake cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          -DBUILD_INTEGRATION_TESTS=ON -DBUILD_EXAMPLES=ON

      - name: Build library, example and browser test
        run: cmake --build build --config Release

      - name: Run browser test (headless Chrome, SwiftShader)
        env:
          CHROME_FLAGS: >-
            --no-sandbox
            --use-webgpu-adapter=swiftshader
            --enable-features=Vulkan
            --use-vulkan=swiftshader
            --use-angle=swiftshader
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          "$CHROME_PATH" --version
          ctest --test-dir build --verbose --timeout 300
